{% extends "base.html" %}

{% block titulo %}{{ 'Editar producto' if producto else 'Nuevo producto' }}{% endblock %}

{% block contenido %}
<h2 class="mb-3">{{ 'Editar producto' if producto else 'Nuevo producto' }}</h2>
<div class="card"><div class="card-body">
    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" name="nombre" class="form-control" value="{{ producto.nombre if producto else '' }}" required>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Precio (Bs)</label>
                <input type="number" step="0.01" min="0" name="precio" class="form-control" value="{{ producto.precio if producto else '' }}" required>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Stock</label>
                <input type="number" min="0" name="stock" class="form-control" value="{{ producto.stock if producto else '' }}" required>
            </div>
        </div>
        <button class="btn btn-primary">Guardar</button>
        <a href="{{ url_for('productos.lista') }}" class="btn btn-outline-secondary">Cancelar</a>
    </form>
</div></div>
{% endblock %}
