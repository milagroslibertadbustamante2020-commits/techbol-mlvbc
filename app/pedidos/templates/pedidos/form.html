{% extends "base.html" %}

{% block titulo %}{{ 'Editar pedido' if pedido else 'Nuevo pedido' }}{% endblock %}

{% block contenido %}
<h2 class="mb-3">{{ 'Editar pedido' if pedido else 'Nuevo pedido' }}</h2>
<div class="card"><div class="card-body">
    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Cliente</label>
            <select name="cliente_id" class="form-select" required>
                {% for c in clientes %}
                <option value="{{ c.id }}" {{ 'selected' if pedido and pedido.cliente_id == c.id }}>{{ c.nombre }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Producto</label>
            <select name="producto_id" class="form-select" required>
                {% for p in productos %}
                <option value="{{ p.id }}" {{ 'selected' if pedido and pedido.producto_id == p.id }}>{{ p.nombre }} - Bs {{ '%.2f'|format(p.precio) }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Monto (Bs) <small class="text-muted">(si lo dejas vacío se usa el precio del producto)</small></label>
            <input type="number" step="0.01" min="0" name="monto" class="form-control" value="{{ pedido.monto if pedido else '' }}">
        </div>
        <button class="btn btn-primary">Guardar</button>
        <a href="{{ url_for('pedidos.lista') }}" class="btn btn-outline-secondary">Cancelar</a>
    </form>
</div></div>
{% endblock %}
