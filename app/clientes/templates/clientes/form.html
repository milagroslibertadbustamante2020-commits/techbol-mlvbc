{% extends "base.html" %}

{% block titulo %}{{ 'Editar cliente' if cliente else 'Nuevo cliente' }}{% endblock %}

{% block contenido %}
<h2 class="mb-3">{{ 'Editar cliente' if cliente else 'Nuevo cliente' }}</h2>
<div class="card"><div class="card-body">
    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" name="nombre" class="form-control" value="{{ cliente.nombre if cliente else '' }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Teléfono</label>
            <input type="text" name="telefono" class="form-control" value="{{ cliente.telefono if cliente and cliente.telefono else '' }}">
        </div>
        <button class="btn btn-primary">Guardar</button>
        <a href="{{ url_for('clientes.lista') }}" class="btn btn-outline-secondary">Cancelar</a>
    </form>
</div></div>
{% endblock %}
